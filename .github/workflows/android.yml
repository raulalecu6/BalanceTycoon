# Compila el juego en los servidores de GitHub cada vez que se sube un cambio a main:
# ejecuta los tests del motor, genera el APK de prueba y lo publica en la release «ultima-version»,
# desde donde se puede descargar e instalar directamente en el móvil.
name: Compilar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      - name: Preparar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Tests del motor contable
        run: ./gradlew :core:test --stacktrace

      - name: Compilar el APK de prueba
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Guardar el APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: BalanceTycoon-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Publicar el APK en la release «ultima-version»
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk BalanceTycoon-debug.apk
          gh release delete ultima-version --yes --cleanup-tag || true
          gh release create ultima-version BalanceTycoon-debug.apk \
            --title "Última versión de prueba" \
            --notes "APK de prueba generado automáticamente a partir del commit ${GITHUB_SHA::7}. Descárgalo desde el móvil e instálalo; las versiones siguientes se instalan encima sin perder la partida." \
            --prerelease
